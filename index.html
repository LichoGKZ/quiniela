<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiniela Virtual Argentina</title>
<style>
:root{
  --bg:#1e1f2b; --bg2:#2b2d3f; --text:#f2f3f5; --muted:#b5bac1;
  --blurple:#5865F2; --blurple-h:#4752c4; --gold:#fbbf24; --card:#313338;
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef0ff; --bg2:#dfe3ff; --text:#1e1f22; --muted:#4e5058; --card:#ffffff;
    color-scheme: light;
  }
}
:root[data-theme="dark"]{--bg:#1e1f2b;--bg2:#2b2d3f;--text:#f2f3f5;--muted:#b5bac1;--card:#313338;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"gg sans","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  background-image:radial-gradient(circle at 20% 10%,var(--bg2),transparent 55%),radial-gradient(circle at 85% 90%,rgba(88,101,242,.35),transparent 50%);
  display:flex;align-items:center;justify-content:center;
}
main{width:100%;max-width:640px;padding:32px 20px;text-align:center}
.badge{
  display:inline-block;background:rgba(88,101,242,.18);color:var(--blurple);
  border:1px solid rgba(88,101,242,.5);padding:6px 14px;border-radius:999px;
  font-weight:700;font-size:.9rem;letter-spacing:.3px;margin-bottom:20px;
}
h1{font-size:clamp(2rem,7vw,3.4rem);line-height:1.1;margin:0 0 14px;font-weight:800}
h1 span{color:var(--gold)}
.sub{color:var(--muted);font-size:1.1rem;margin:0 0 32px}
.btn{
  display:inline-flex;align-items:center;gap:12px;background:var(--blurple);color:#fff;
  text-decoration:none;font-weight:700;font-size:1.2rem;padding:16px 32px;border-radius:8px;
  transition:background .15s,transform .15s,box-shadow .15s;
  box-shadow:0 8px 24px rgba(88,101,242,.4);
}
.btn:hover{background:var(--blurple-h);transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn svg{width:28px;height:28px;fill:#fff;flex:none}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:40px}
.card{background:var(--card);border-radius:12px;padding:20px 16px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.card strong{display:block;font-size:1.7rem;color:var(--gold);margin-bottom:6px}
.card p{margin:0;color:var(--muted);font-size:.95rem}
@media(max-width:480px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <div class="badge">¡Ahora en Discord!</div>
  <h1>La primer <span>Quiniela virtual</span> de Argentina</h1>
  <p class="sub">Todos los días a las 17hs podés ganarte hasta <strong>$300 mil</strong> de pozo acumulado.</p>

  <a class="btn" href="https://discord.gg/McdwddnMvN" target="_blank" rel="noopener">
    <svg viewBox="0 0 127.14 96.36" aria-hidden="true"><path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.71 1.76 1.39 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15ZM42.45 65.69C36.18 65.69 31 60 31 53s5-12.74 11.43-12.74S54 46 53.89 53s-5.05 12.69-11.44 12.69Zm42.24 0C78.41 65.69 73.25 60 73.25 53s5-12.74 11.44-12.74S96.23 46 96.12 53s-5.04 12.69-11.43 12.69Z"/></svg>
    Ingresar al servidor
  </a>

  <div class="cards">
    <div class="card"><strong>17 hs</strong><p>Sorteo todos los días</p></div>
    <div class="card"><strong>$1.000</strong><p>Sale cada número</p></div>
  </div>
</main>
</body>
</html>
